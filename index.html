    <!-- Modal Overlay -->
    <div 
      id="modalOverlay"
      class="modal-overlay fixed inset-0 z-40 items-center justify-center p-4"
    >
      <div 
        class="w-full max-w-3xl bg-white border border-black relative z-50 overflow-hidden flex flex-col"
      >
        <div class="flex items-center justify-between p-3 border-b border-black">
          <span id="modalTitle" class="text-base capitalize"></span>
          <button 
            onclick="closeModal()"
            class="hover:text-blue-600 font-bold text-2xl px-2 leading-none"
            aria-label="Close"
          >
            ×
          </button>
        </div>
        <div id="modalContent" class="overflow-auto">
        </div>
      </div>
    </div>

    <script>
      // Set viewport height for mobile browsers (handles address bar)
      function setViewportHeight() {
        const vh = window.innerHeight;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
        document.querySelector('main').style.height = `${vh}px`;
      }
      
      // Run on load and resize
      setViewportHeight();
      window.addEventListener('resize', setViewportHeight);
      window.addEventListener('orientationchange', setViewportHeight);
      
      function openModal(type) {
        const overlay = document.getElementById('modalOverlay');
        const title = document.getElementById('modalTitle');
        const content = document.getElementById('modalContent');
        
        title.textContent = type;
        
        // Get template and clone its content
        const template = document.getElementById(type + 'Template');
        content.innerHTML = ''; // Clear existing content
        const clone = template.content.cloneNode(true);
        content.appendChild(clone);
        
        overlay.classList.add('active');
      }
      
      function closeModal() {
        const overlay = document.getElementById('modalOverlay');
        overlay.classList.remove('active');
        return false;
      }
      
      // Close modal when clicking outside
      document.getElementById('modalOverlay').addEventListener('click', function(e) {
        if (e.target.id === 'modalOverlay') {
          closeModal();
        }
      });
      
      // Close modal on Escape key
      document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
          closeModal();
        }
      });
    </script>
</body>
</html>
